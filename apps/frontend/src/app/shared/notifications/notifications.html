<!--
  aria-live so a toast is announced by a screen reader; "polite" because none
  of these interrupt what the user is doing.
-->
<div class="toasts" role="status" aria-live="polite">
  @for (note of notifications(); track note.id) {
    <div class="toast" [class]="'is-' + note.type">
      <span class="toast-rule" aria-hidden="true"></span>
      <span class="toast-message">{{ note.message }}</span>
      <button type="button" class="toast-close" (click)="close(note.id)" aria-label="Dismiss">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
  }
</div>
