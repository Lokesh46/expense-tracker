<app-auth-layout
  eyebrow="Sign in"
  heading="Welcome back"
  blurb="Pick up where your ledger left off."
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage(); as message) {
      <p class="form-alert" role="alert">{{ message }}</p>
    }

    <div class="field">
      <label for="username">Username</label>
      <input
        id="username"
        class="input"
        type="text"
        formControlName="username"
        autocomplete="username"
        [class.is-invalid]="invalid('username')"
      />
      @if (invalid('username')) {
        <span class="field-error">Enter your username.</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          class="input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="invalid('password')"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (invalid('password')) {
        <span class="field-error">Enter your password.</span>
      }
    </div>

    <label class="remember">
      <input type="checkbox" formControlName="rememberMe" />
      <span>Keep me signed in on this device</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="auth-switch">
      No account yet? <a routerLink="/register">Create one</a>
    </p>
  </form>
</app-auth-layout>
