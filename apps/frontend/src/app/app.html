<app-notifications />

@if (isAuthenticated()) {
  <a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to content</a>

  <div class="shell">
    <app-sidebar />

    <main id="main-content" class="shell-main" tabindex="-1">
      <div class="shell-inner">
        <router-outlet />
      </div>
    </main>
  </div>
} @else {
  <router-outlet />
}
