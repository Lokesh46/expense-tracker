<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledger — Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track spending, set monthly budgets and keep recurring costs in view.">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">

  <!--
    Fraunces  - editorial display serif, variable (opsz / SOFT / WONK axes)
    Hanken Grotesk - UI text
    JetBrains Mono - tabular figures for money columns
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!--
    Applied before first paint so a dark-mode user never sees a white flash.
    Kept inline and tiny for that reason.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        /* Storage can be unavailable in private mode; the OS preference still applies. */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
