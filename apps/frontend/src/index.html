<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledger — Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track spending, set monthly budgets and keep recurring costs in view.">
  <!--
    The brand mark, three stacked rules, as the tab icon.

    This used to point at /assets/icon.svg, which never existed -- there is no
    assets directory, and public/ is copied to the site root -- so every load
    404ed and the browser fell back to the stock Angular favicon.ico.

    The SVG is preferred and stays crisp at any size. The .ico is there for
    Safari before 16.4 and for Windows shortcuts, and carries 16, 32 and 48px.
  -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!--
    Tints browser chrome on mobile to match the theme, so the app does not sit in
    a strip of the wrong colour. Matches --canvas in styles.css.
  -->
  <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e0f" media="(prefers-color-scheme: dark)">

  <!--
    Fraunces  - editorial display serif, variable (opsz / SOFT / WONK axes)
    Hanken Grotesk - UI text
    JetBrains Mono - tabular figures for money columns
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!--
    Applied before first paint so a dark-mode user never sees a white flash.
    Kept inline and tiny for that reason.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        /* Storage can be unavailable in private mode; the OS preference still applies. */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
