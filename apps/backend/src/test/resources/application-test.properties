# In-memory database, discarded between runs so tests never inherit state.
spring.datasource.url=jdbc:h2:mem:expense-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

frontend.url=http://localhost:4300

# Written under target/ so a clean build discards it.
app.jwt.key-store=./target/test-jwt-key.json
app.jwt.ttl-minutes=90

# Never let the scheduled sweep fire mid-test; the tests drive generation
# explicitly so their assertions are deterministic.
app.recurring.cron=-

logging.level.org.springframework=WARN
logging.level.com.lokesh_codes=WARN
