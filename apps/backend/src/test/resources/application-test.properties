# In-memory database, discarded between runs so tests never inherit state.
spring.datasource.url=jdbc:h2:mem:expense-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

frontend.url=http://localhost:4300

# Written under target/ so a clean build discards it.
app.jwt.key-store=./target/test-jwt-key.json
app.jwt.ttl-minutes=90

# Never let the scheduled sweep fire mid-test; the tests drive generation
# explicitly so their assertions are deterministic.
app.recurring.cron=-
app.activity.purge-cron=-

# No administrator is conjured out of configuration during tests: they appoint
# one explicitly, so a test's starting state is visible in the test.
app.admin.username=

# Lockout tests need a threshold they can reach without twenty requests.
app.security.max-failed-attempts=3
app.security.lockout-minutes=15

logging.level.org.springframework=WARN
logging.level.com.lokesh_codes=WARN
