spring.application.name=expense_tracker_backend

# Default to the local dev profile (H2, file-backed).
# Production overrides this with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8081}

# --- JPA (shared) ---
spring.jpa.open-in-view=false

# --- Auth ---
# Signing key lives outside the source tree so tokens survive a restart.
app.jwt.key-store=${JWT_KEY_STORE:./data/jwt-signing-key.json}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:90}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- CSV import ---
# The default 1MB cap rejects a modest bank statement.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Recurring transactions ---
# Nightly sweep so rules fire for users who are not signed in.
app.recurring.cron=0 15 2 * * *
