spring.application.name=expense_tracker_backend

# Default to the local dev profile (H2, file-backed).
# Production overrides this with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8081}

# --- JPA (shared) ---
spring.jpa.open-in-view=false

# --- Auth ---
# The signing key must outlive a restart, or every issued token dies with it.
# In production set JWT_SIGNING_KEY to the JWK itself: a container filesystem is
# wiped on redeploy, so a file-based key would sign everyone out on each deploy.
app.jwt.key=${JWT_SIGNING_KEY:}
app.jwt.key-store=${JWT_KEY_STORE:./data/jwt-signing-key.json}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:90}

# --- User management ---
# A fresh deployment has no administrator and no way to appoint one, since only
# an administrator may promote anybody. Set ADMIN_USERNAME to an existing
# username and that account is promoted on the next start. Idempotent, so it can
# be left set; harmless if the account does not exist yet.
app.admin.username=${ADMIN_USERNAME:}

# Consecutive failed sign-ins before an account locks itself, and for how long.
# Set the lockout to 0 to disable locking entirely.
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.security.lockout-minutes=${LOCKOUT_MINUTES:15}

# --- Activity log ---
# The audit trail is the one table with no natural ceiling, so it is trimmed
# nightly. 0 keeps everything. The purge runs half an hour after the recurring
# sweep rather than alongside it: a free-tier database gets one small compute
# instance and two write-heavy jobs at once is how a nightly job starts timing
# out.
app.activity.retention-days=${ACTIVITY_RETENTION_DAYS:180}
app.activity.purge-cron=0 45 2 * * *

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- CSV import ---
# The default 1MB cap rejects a modest bank statement.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# An uploaded statement must never reach the disk. Tomcat spills a part to a
# temp file once it exceeds this threshold, and the default is 0B -- meaning
# every upload was written out before the controller ever saw it. Holding the
# threshold at the maximum accepted size keeps the part in memory for its whole
# life, which is what makes "we scan it and it is gone" true rather than
# aspirational. Raising max-file-size without raising this reintroduces the
# spill.
spring.servlet.multipart.file-size-threshold=5MB

# How many imports and exports one account may run per hour. Bulk endpoints are
# the cheapest way to scrape an account or to flatten a small instance.
app.csv.max-imports-per-hour=${CSV_MAX_IMPORTS_PER_HOUR:5}
app.csv.max-exports-per-hour=${CSV_MAX_EXPORTS_PER_HOUR:10}

# --- Recurring transactions ---
# Nightly sweep so rules fire for users who are not signed in.
app.recurring.cron=0 15 2 * * *
