# ---------------------------------------------------------------
# Local development: file-backed H2. No database server required.
# Data persists in ./data/expensedb.mv.db between restarts.
# ---------------------------------------------------------------

spring.datasource.url=jdbc:h2:file:./data/expensedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Browse the dev database at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

frontend.url=${FRONTEND_URL:http://localhost:[*]}

logging.level.org.springframework=INFO
logging.level.com.lokesh_codes=DEBUG
