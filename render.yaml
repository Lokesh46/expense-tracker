# =============================================================================
# Render blueprint for the backend.
#
# Every secret is declared with `sync: false`, which means Render prompts for
# it in the dashboard and never stores it in this file. Nothing sensitive
# belongs in the repository.
#
# The database is deliberately not defined here: Render's free Postgres expires
# after a trial period and is deleted, which is what killed the previous
# deployment. Use an external provider with a persistent free tier (Neon) and
# paste its connection details into the variables below.
# =============================================================================
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    # The build context is the repository root, matching the Dockerfile's paths.
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # JDBC URL, e.g. jdbc:postgresql://HOST/DB?sslmode=require
      # Note the jdbc: prefix -- Neon shows a postgresql:// URL, which Java
      # cannot use as-is.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Exact origin of the deployed frontend, e.g. https://your-app.vercel.app
      # A trailing slash will not match.
      - key: FRONTEND_URL
        sync: false

      # The JWT signing key as a JWK. Without it the key is regenerated on every
      # deploy and every signed-in user is silently logged out. Run the app once
      # locally and copy apps/backend/data/jwt-signing-key.json verbatim.
      - key: JWT_SIGNING_KEY
        sync: false

      # The username to promote to administrator.
      #
      # A fresh deployment has no administrator and no way to appoint one, since
      # only an administrator can promote anybody. This is the way in: set it to
      # the username you are about to register, and that account is an
      # administrator the moment it is created. It also works the other way round
      # -- an account that already exists is promoted on the next start.
      # Idempotent, so it can be left set.
      #
      # Whoever holds that username gets the role, so set it shortly before
      # registering rather than leaving a guessable name configured against an
      # empty database.
      #
      # Not a secret, but still `sync: false` rather than a value here: naming the
      # administrator in a public repository tells anyone reading it which single
      # account is worth guessing a password for.
      - key: ADMIN_USERNAME
        sync: false
